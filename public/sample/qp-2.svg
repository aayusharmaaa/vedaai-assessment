<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754"><rect width="1240" height="1754" fill="#ffffff"/><text x="620" y="174" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111">Section C</text><text x="90" y="220" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">8. Draw a neat labelled diagram of the human digestive system, labelling</text><text x="90" y="260" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">    at least five organs, and state one function of the liver.</text><text x="1150" y="220" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[5]</text><text x="90" y="326" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">9. Differentiate between arteries and veins on the basis of wall thickness,</text><text x="90" y="366" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">    presence of valves, and direction of blood flow.</text><text x="1150" y="326" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[3]</text><text x="90" y="432" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">10. What is transpiration? State two functions of transpiration in plants.</text><text x="1150" y="432" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[3]</text><text x="620" y="1694" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#777">Page 2 of 2</text></svg>