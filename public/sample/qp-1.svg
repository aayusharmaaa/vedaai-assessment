<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754"><rect width="1240" height="1754" fill="#ffffff"/><text x="620" y="120" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#111">DELHI PUBLIC SCHOOL, BOKARO STEEL CITY</text><text x="620" y="168" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#333">Class X &#8226; Biology &#8226; Unit Test</text><text x="90" y="212" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#444">Time: 1 hour</text><text x="1150" y="212" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#444">Maximum Marks: 28</text><line x1="90" y1="228" x2="1150" y2="228" stroke="#999" stroke-width="2"/><text x="620" y="284" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111">Section A</text><text x="90" y="330" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">1. Which of the following organelles is primarily involved in</text><text x="90" y="370" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">    photosynthesis?</text><text x="90" y="410" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">        A) Mitochondrion        B) Chloroplast</text><text x="90" y="450" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">        C) Ribosome                D) Nucleus</text><text x="1150" y="330" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[1]</text><text x="90" y="516" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">2. Which blood vessel carries blood away from the heart?</text><text x="90" y="556" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">        A) Vein                          B) Artery</text><text x="90" y="596" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">        C) Capillary                  D) Venule</text><text x="1150" y="516" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[1]</text><text x="90" y="662" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">3. The green pigment that traps light energy in plants is called:</text><text x="90" y="702" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">        A) Haemoglobin            B) Chlorophyll</text><text x="90" y="742" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">        C) Carotene                    D) Xanthophyll</text><text x="1150" y="662" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[1]</text><text x="620" y="842" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111">Section B</text><text x="90" y="888" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">4. Explain the role of chloroplasts in photosynthesis, naming the main</text><text x="90" y="928" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">    pigments involved and briefly outlining the two major stages of the</text><text x="90" y="968" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">    process.</text><text x="1150" y="888" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[3]</text><text x="90" y="1034" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">5. Describe the flow of blood through the human heart starting from the</text><text x="90" y="1074" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">    right atrium and ending at the aorta; include the names of the valves</text><text x="90" y="1114" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">    crossed.</text><text x="1150" y="1034" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[3]</text><text x="90" y="1180" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">6. Write the balanced chemical equation for photosynthesis and state</text><text x="90" y="1220" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">    where the plant obtains each raw material from.</text><text x="1150" y="1180" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[3]</text><text x="620" y="1320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111">Section C</text><text x="90" y="1366" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">7. (a) Draw a labelled diagram of an alveolus showing the capillary</text><text x="90" y="1406" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">            network and air space. Label the alveolar sac, the capillary, and</text><text x="90" y="1446" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">            the direction of gas exchange.</text><text x="1150" y="1366" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[3]</text><text x="90" y="1512" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">    (b) State two structural features of alveoli that make them efficient</text><text x="90" y="1552" font-family="'Times New Roman',Georgia,serif" font-size="27" fill="#111" xml:space="preserve">            for gas exchange.</text><text x="1150" y="1512" text-anchor="end" font-family="'Times New Roman',Georgia,serif" font-size="25" fill="#111">[2]</text><text x="620" y="1694" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#777">Page 1 of 2</text></svg>