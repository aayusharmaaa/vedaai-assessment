<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754"><rect width="1240" height="1754" fill="#fdfcf7"/><line x1="70" y1="130" x2="1180" y2="130" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="178" x2="1180" y2="178" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="226" x2="1180" y2="226" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="274" x2="1180" y2="274" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="322" x2="1180" y2="322" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="370" x2="1180" y2="370" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="418" x2="1180" y2="418" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="466" x2="1180" y2="466" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="514" x2="1180" y2="514" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="562" x2="1180" y2="562" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="610" x2="1180" y2="610" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="658" x2="1180" y2="658" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="706" x2="1180" y2="706" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="754" x2="1180" y2="754" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="802" x2="1180" y2="802" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="850" x2="1180" y2="850" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="898" x2="1180" y2="898" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="946" x2="1180" y2="946" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="994" x2="1180" y2="994" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1042" x2="1180" y2="1042" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1090" x2="1180" y2="1090" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1138" x2="1180" y2="1138" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1186" x2="1180" y2="1186" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1234" x2="1180" y2="1234" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1282" x2="1180" y2="1282" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1330" x2="1180" y2="1330" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1378" x2="1180" y2="1378" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1426" x2="1180" y2="1426" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1474" x2="1180" y2="1474" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1522" x2="1180" y2="1522" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1570" x2="1180" y2="1570" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1618" x2="1180" y2="1618" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1666" x2="1180" y2="1666" stroke="#c9d6e8" stroke-width="2"/><line x1="140" y1="60" x2="140" y2="1694" stroke="#e79a9a" stroke-width="2.5"/><text x="165" y="150" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">There are two main stages :</text><text x="165" y="198" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">1. Light reaction - captures light energy in the grana</text><text x="165" y="246" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">     and makes ATP and NADPH.</text><text x="165" y="294" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">2. Dark reaction - uses that energy to make glucose</text><text x="165" y="342" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">     in the stroma.</text><text x="165" y="414" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">Q6.  6CO2 + 6H2O  --light/chlorophyll--&gt;  C6H12O6 + 6O2</text><text x="165" y="462" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        Carbon dioxide is taken from the air through the</text><text x="165" y="510" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        stomata and water is absorbed from the soil by the</text><text x="165" y="558" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        roots.</text><text x="165" y="630" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">Q5.  Blood comes into the right atrium from the body.</text><text x="165" y="678" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        Then it goes to the right ventricle and is pumped to</text><text x="165" y="726" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        the lungs. From the lungs it comes back to the left</text><text x="165" y="774" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        atrium, goes to the left ventricle and then out</text><text x="165" y="822" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        through the aorta to the whole body.</text><text x="620" y="1714" text-anchor="middle" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="24" fill="#8a93a6">2</text></svg>