ell. The main</text><text x="165" y="426" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        pigment is chlorophyll, which is green in colour, and</text><text x="165" y="474" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        the accessory pigments are carotenoids.</text><g transform="translate(0,522)">
