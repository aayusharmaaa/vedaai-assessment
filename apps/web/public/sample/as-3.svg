<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754"><rect width="1240" height="1754" fill="#fdfcf7"/><line x1="70" y1="130" x2="1180" y2="130" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="178" x2="1180" y2="178" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="226" x2="1180" y2="226" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="274" x2="1180" y2="274" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="322" x2="1180" y2="322" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="370" x2="1180" y2="370" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="418" x2="1180" y2="418" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="466" x2="1180" y2="466" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="514" x2="1180" y2="514" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="562" x2="1180" y2="562" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="610" x2="1180" y2="610" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="658" x2="1180" y2="658" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="706" x2="1180" y2="706" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="754" x2="1180" y2="754" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="802" x2="1180" y2="802" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="850" x2="1180" y2="850" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="898" x2="1180" y2="898" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="946" x2="1180" y2="946" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="994" x2="1180" y2="994" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1042" x2="1180" y2="1042" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1090" x2="1180" y2="1090" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1138" x2="1180" y2="1138" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1186" x2="1180" y2="1186" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1234" x2="1180" y2="1234" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1282" x2="1180" y2="1282" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1330" x2="1180" y2="1330" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1378" x2="1180" y2="1378" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1426" x2="1180" y2="1426" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1474" x2="1180" y2="1474" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1522" x2="1180" y2="1522" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1570" x2="1180" y2="1570" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1618" x2="1180" y2="1618" stroke="#c9d6e8" stroke-width="2"/><line x1="70" y1="1666" x2="1180" y2="1666" stroke="#c9d6e8" stroke-width="2"/><line x1="140" y1="60" x2="140" y2="1694" stroke="#e79a9a" stroke-width="2.5"/><text x="165" y="150" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">Q7(a).</text><g transform="translate(0,198)">
    <g stroke="#1a3a8f" fill="none" stroke-width="2.5">
      <circle cx="330" cy="140" r="62"/>
      <circle cx="428" cy="96" r="44"/>
      <circle cx="440" cy="196" r="40"/>
      <line x1="250" y1="140" x2="200" y2="140"/>
      <path d="M200 140 q-40 -60 -90 -30" />
      <path d="M268 76 q90 -60 180 -10 q80 44 40 130 q-40 84 -150 60"
            stroke-dasharray="7 7"/>
      <line x1="520" y1="120" x2="600" y2="90"/>
      <path d="M600 90 l-18 -2 l6 16 z" fill="#1a3a8f"/>
      <line x1="600" y1="180" x2="520" y2="180"/>
      <path d="M520 180 l18 -8 l0 16 z" fill="#1a3a8f"/>
    </g>
    <g font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="25" fill="#1a3a8f">
      <text x="612" y="96">O2 in</text>
      <text x="612" y="188">CO2 out</text>
      <text x="240" y="252">Alveolar sac</text>
      <text x="470" y="268">Capillary</text>
      <text x="60" y="104">Bronchiole</text>
    </g></g><text x="165" y="528" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">Q7(b).  (i) The alveoli have very thin walls, only one</text><text x="165" y="576" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">               cell thick, so gases can diffuse quickly.</text><text x="165" y="624" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">          (ii) They are present in very large numbers, which</text><text x="165" y="672" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">               gives a very large surface area for exchange.</text><text x="165" y="744" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">Q9.  Arteries have thick and elastic walls while veins</text><text x="165" y="792" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        have thin walls. Veins have valves in them but</text><text x="165" y="840" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        arteries do not have valves. Arteries carry blood</text><text x="165" y="888" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        away from the heart and veins bring blood back</text><text x="165" y="936" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">        to the heart.</text><text x="620" y="1714" text-anchor="middle" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="24" fill="#8a93a6">3</text></svg>