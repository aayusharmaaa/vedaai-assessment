    </g></g><text x="165" y="688" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">The liver makes bile, which helps in the digestion of fats.</text><text x="165" y="766" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">Q12.  Osmosis is the movement of water molecules from</text><text x="165" y="814" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">          a dilute solution to a concentrated solution through</text><text x="165" y="862" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="31" fill="#1a3a8f" xml:space="preserve">          a semi-permeable membrane.</text><text x="165" y="934" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="27" fill="#1a3a8f" xml:space="preserve">Rough work :</text><text x="165" y="982" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="27" fill="#1a3a8f" xml:space="preserve">6 x 2 = 12,   12 + 6 = 18</text><text x="620" y="1714" text-anchor="middle" font-family="'Segoe Script','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size="24" fill="#8a93a6">4</text></svg>